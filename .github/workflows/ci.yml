name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Testes (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar a suíte
        run: ./gradlew test --console=plain

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

# ---------------------------------------------------------------------------
# Etapa futura (Android SDK disponível): job de release.
# Em push de tag `v*`, rodar `./gradlew assembleRelease` (com keystore via
# secrets) e anexar o `app-release.apk` à GitHub Release. O usuário instala
# por sideload e pode usar Obtainium para auto-atualizar a partir das releases.
# ---------------------------------------------------------------------------
